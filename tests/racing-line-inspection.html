<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Racing line inspection</title>
<style>body{margin:0;font:14px system-ui;color:#fff;background:#182329}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;top:12px;left:12px;display:flex;gap:12px;align-items:center;padding:12px;background:#182329e8;flex-wrap:wrap}select,button,input{font:inherit;padding:8px}input[type=number]{width:90px}#status{position:fixed;bottom:12px;left:12px;background:#182329e8;padding:10px}</style></head>
<body><nav><label>Circuit <select id="track"></select></label><label>x <input id="x" type="number"></label><label>z <input id="z" type="number"></label><label>View (m) <input id="size" type="number" value="160"></label><button id="go">Show</button><button id="prev">Previous corner</button><button id="next">Next corner</button></nav><canvas></canvas><output id="status">Loading</output><script type="module" src="./racing-line-inspection.ts"></script></body></html>
